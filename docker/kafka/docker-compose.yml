# Kafka de DuocConecta (v3): 3 ZooKeeper, 3 brokers y Kafka UI.
#
#   docker compose -f docker/kafka/docker-compose.yml up -d
#
# Lo mismo corre en la nube, en la EC2 que crea "infra/aws.sh kafka".
# Kafka UI: http://localhost:8089 (el 8080 es del BFF).
#
# Cada broker tiene dos listeners:
#   INTERNO  kafka-N:29092 — entre brokers, para Kafka UI y kafka-init (red de Docker).
#   EXTERNO  <host>:909N   — para los microservicios. En local el host es localhost;
#                            en la EC2 es su IP privada (KAFKA_HOST_ANUNCIADO).
#
# El heap y el tope de memoria se ajustan por variable: en un Mac de 8 GB van chicos.

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.9.10
  restart: unless-stopped
  mem_limit: ${ZOOKEEPER_MEMORIA:-320m}
  healthcheck:
    # "ruok" responde "imok" si el nodo atiende; sin abrir una JVM en cada chequeo.
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/2181 && echo ruok >&3 && grep -q imok <&3'"]
    interval: 10s
    timeout: 5s
    retries: 12

x-zookeeper-entorno: &zookeeper-entorno
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # Ensamble de 3: decide por mayoría (2 de 3), así tolera la caída de uno.
  ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
  KAFKA_HEAP_OPTS: "-Xms${ZOOKEEPER_HEAP:-128m} -Xmx${ZOOKEEPER_HEAP:-128m}"
  KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,mntr"

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.9.10
  restart: unless-stopped
  mem_limit: ${KAFKA_MEMORIA:-700m}
  depends_on:
    zookeeper-1: { condition: service_healthy }
    zookeeper-2: { condition: service_healthy }
    zookeeper-3: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/29092'"]
    interval: 10s
    timeout: 5s
    retries: 18

x-kafka-entorno: &kafka-entorno
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
  # Valores por defecto del clúster: 3 copias de todo, y una escritura con acks=all
  # necesita 2 réplicas al día. Así se tolera la caída de un broker sin perder datos.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Un nombre mal escrito no debe crear un tópico nuevo con la configuración por defecto.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Nunca elegir como líder una réplica atrasada: preferimos no disponible a perder datos.
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_HEAP_OPTS: "-Xms${KAFKA_HEAP:-384m} -Xmx${KAFKA_HEAP:-384m}"

services:
  zookeeper-1:
    <<: *zookeeper
    hostname: zookeeper-1
    container_name: duocconecta-zookeeper-1
    environment: { <<: *zookeeper-entorno, ZOOKEEPER_SERVER_ID: 1 }
    volumes: [datos-zookeeper-1:/var/lib/zookeeper/data, registro-zookeeper-1:/var/lib/zookeeper/log]

  zookeeper-2:
    <<: *zookeeper
    hostname: zookeeper-2
    container_name: duocconecta-zookeeper-2
    environment: { <<: *zookeeper-entorno, ZOOKEEPER_SERVER_ID: 2 }
    volumes: [datos-zookeeper-2:/var/lib/zookeeper/data, registro-zookeeper-2:/var/lib/zookeeper/log]

  zookeeper-3:
    <<: *zookeeper
    hostname: zookeeper-3
    container_name: duocconecta-zookeeper-3
    environment: { <<: *zookeeper-entorno, ZOOKEEPER_SERVER_ID: 3 }
    volumes: [datos-zookeeper-3:/var/lib/zookeeper/data, registro-zookeeper-3:/var/lib/zookeeper/log]

  kafka-1:
    <<: *kafka
    hostname: kafka-1
    container_name: duocconecta-kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-entorno
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: "INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNO://kafka-1:29092,EXTERNO://${KAFKA_HOST_ANUNCIADO:-localhost}:9092"
    volumes: [datos-kafka-1:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    container_name: duocconecta-kafka-2
    ports: ["9093:9093"]
    environment:
      <<: *kafka-entorno
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: "INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNO://kafka-2:29092,EXTERNO://${KAFKA_HOST_ANUNCIADO:-localhost}:9093"
    volumes: [datos-kafka-2:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    container_name: duocconecta-kafka-3
    ports: ["9094:9094"]
    environment:
      <<: *kafka-entorno
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: "INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNO://kafka-3:29092,EXTERNO://${KAFKA_HOST_ANUNCIADO:-localhost}:9094"
    volumes: [datos-kafka-3:/var/lib/kafka/data]

  # Crea los tópicos de la plataforma y les reaplica la configuración. Corre una vez y termina.
  kafka-init:
    image: confluentinc/cp-kafka:7.9.10
    container_name: duocconecta-kafka-init
    restart: "no"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      BOOTSTRAP: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
      KAFKA_HEAP_OPTS: "-Xmx128m"
    volumes: ["./topicos.sh:/topicos.sh:ro"]
    entrypoint: ["bash", "/topicos.sh"]

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    container_name: duocconecta-kafka-ui
    mem_limit: ${KAFKA_UI_MEMORIA:-512m}
    depends_on:
      kafka-1: { condition: service_healthy }
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: duocconecta
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
      DYNAMIC_CONFIG_ENABLED: "false"
      # Con usuario y clave: en la nube el puerto solo se abre a la IP de quien presenta,
      # y además pide credenciales. Los valores por defecto son solo para local.
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USUARIO:-duocconecta}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_CLAVE:-duocconecta}
      JAVA_OPTS: "-Xmx${KAFKA_UI_HEAP:-256m}"

volumes:
  datos-zookeeper-1:
  datos-zookeeper-2:
  datos-zookeeper-3:
  registro-zookeeper-1:
  registro-zookeeper-2:
  registro-zookeeper-3:
  datos-kafka-1:
  datos-kafka-2:
  datos-kafka-3:
